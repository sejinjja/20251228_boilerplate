<h2>{{ space?.title || ('@' + space?.slug) || 'Posts' }}</h2>
<div *ngIf="loading">Loading...</div>
<ul>
  <li *ngFor="let post of posts">
    <a [routerLink]="['/spaces', space?.slug, 'posts', post.id]">{{ post.title }}</a>
    <span>by {{ post.authorUsername || post.author }}</span>
  </li>
</ul>
<a [routerLink]="['/spaces', space?.slug, 'posts', 'new']">새 글 쓰기</a>
