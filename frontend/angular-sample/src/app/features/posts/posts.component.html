<h2>{{ board?.name || 'Posts' }}</h2>
<div *ngIf="loading">Loading...</div>
<ul>
  <li *ngFor="let post of posts">
    <a [routerLink]="['/boards', board?.slug, 'posts', post.id]">{{ post.title }}</a>
    <span>by {{ post.author }}</span>
  </li>
</ul>
<a [routerLink]="['/boards', board?.slug, 'posts', 'new']">새 글 작성</a>
