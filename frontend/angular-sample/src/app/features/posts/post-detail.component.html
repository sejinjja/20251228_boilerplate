<div *ngIf="loading">Loading...</div>
<section *ngIf="post">
  <h2>{{ post.title }} <small *ngIf="post.boardType">[{{ post.boardType }}]</small></h2>
  <p>{{ post.content }}</p>
  <div>
    <small>게시판: {{ post.boardId || post.boardType }}</small>
  </div>
  <small>작성자: {{ post.author }}</small>
</section>
