<div *ngIf="loading" class="muted">불러오는 중...</div>
<section *ngIf="post" class="panel">
  <div class="header-row">
    <div>
      <p class="pill">&#64;{{ post.space?.username }}</p>
      <h2>{{ post.title }}</h2>
      <p class="muted">{{ post.author?.username }}</p>
    </div>
  </div>
  <p>{{ post.content }}</p>
</section>
