<h2>Boards</h2>
<div *ngIf="loading">불러오는 중...</div>
<ul>
  <li *ngFor="let b of boards">
    <strong>{{ b.name }}</strong> ({{ b.slug }}) - {{ b.type }}
    <span *ngIf="b.isDefault">[default]</span>
  </li>
</ul>

<div *ngIf="error" class="error">{{ error }}</div>

<section *ngIf="(user$ | async)?.role === 'admin'">
  <h3>게시판 생성 (관리자)</h3>
  <form [formGroup]="form" (ngSubmit)="create()">
    <label>이름 <input formControlName="name" /></label>
    <div class="hint" *ngIf="form.controls.name.touched && form.controls.name.invalid">이름을 입력하세요.</div>
    <label>슬러그 <input formControlName="slug" placeholder="영문/숫자" /></label>
    <div class="hint" *ngIf="form.controls.slug.touched && form.controls.slug.invalid">슬러그를 입력하세요.</div>
    <label>타입
      <select formControlName="type">
        <option value="free">자유게시판</option>
        <option value="notice">공지사항</option>
        <option value="trade">중고거래</option>
      </select>
    </label>
    <label><input type="checkbox" formControlName="isDefault" /> 기본 보드로 설정</label>
    <button type="submit" [disabled]="creating">생성</button>
  </form>
</section>
