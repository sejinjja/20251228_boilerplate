<section class="panel">
  <div class="header-row">
    <div>
      <p class="pill">공간</p>
      <h2>사용자 공간</h2>
      <p class="muted">모든 사용자의 공간을 둘러보세요.</p>
    </div>
  </div>
  <div *ngIf="loading" class="muted">불러오는 중...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <ul class="list">
    <li *ngFor="let s of spaces">
      <div>
        <strong>{{ s.username }}</strong>
        <div class="muted">owner #{{ s.ownerId }}</div>
      </div>
      <a class="btn" [routerLink]="['/spaces', s.username, 'posts']">글 보기</a>
    </li>
  </ul>
</section>
