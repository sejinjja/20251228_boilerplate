<h2>Sign up</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Email <input formControlName="email" type="email" /></label>
  <div class="hint" *ngIf="f.email.touched && f.email.invalid">
    <span *ngIf="f.email.errors?.['required']">이메일을 입력하세요.</span>
    <span *ngIf="f.email.errors?.['email']">올바른 이메일 형식이어야 합니다.</span>
  </div>
  <label>Username (닉네임) <input formControlName="username" /></label>
  <div class="hint" *ngIf="f.username.touched && f.username.invalid">
    <span *ngIf="f.username.errors?.['required']">닉네임을 입력하세요.</span>
  </div>
  <label>Display name <input formControlName="displayName" /></label>
  <div class="hint" *ngIf="f.displayName.touched && f.displayName.invalid">
    <span *ngIf="f.displayName.errors?.['required']">표시 이름을 입력하세요.</span>
  </div>
  <label>Password <input formControlName="password" type="password" /></label>
  <div class="hint" *ngIf="f.password.touched && f.password.invalid">
    <span *ngIf="f.password.errors?.['required']">비밀번호를 입력하세요.</span>
    <span *ngIf="f.password.errors?.['minlength']">비밀번호는 최소 {{ f.password.errors?.['minlength'].requiredLength }}자입니다.</span>
  </div>
  <button type="submit" [disabled]="loading">가입</button>
  <div *ngIf="error" class="error">{{ error }}</div>
</form>
